---
# Build and test the Gerrit stacks plugin
#
# Builds infra/gerrit_stacks for the Gerrit tag of infra/docker-compose.yaml,
# runs its tests, runs the jar in that Gerrit image and uploads stacks.jar as an
# artifact, see infra/README.md for installing it. Pull requests that change the
# plugin or that tag run it too.
#
name: SPDK-CI build Gerrit plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
    - '.github/workflows/build_gerrit_plugin.yml'
    - 'infra/docker-compose.yaml'
    - 'infra/gerrit_stacks/**'

jobs:
  build:
    name: Build stacks plugin
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
        cache-dependency-path: infra/gerrit_stacks/pom.xml

    - name: Build plugin
      working-directory: infra/gerrit_stacks
      env:
        REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        version=$(sed -n 's|^ *image: gerritcodereview/gerrit:||p' ../docker-compose.yaml)
        echo "GERRIT_IMAGE=gerritcodereview/gerrit:$version" >> "$GITHUB_ENV"
        mvn -B -ntp -Dgerrit.version="$version" -Dstacks.revision="${REVISION::7}" package

    - name: Run plugin in Gerrit
      working-directory: infra/gerrit_stacks
      run: ./smoke.sh "$GERRIT_IMAGE"

    - name: Upload plugin
      uses: actions/upload-artifact@v7.0.1
      with:
        name: stacks-plugin
        path: infra/gerrit_stacks/target/stacks.jar
        if-no-files-found: error
