---
name: Validate SPDK Website

run-name: >-
  ${{
    github.event.action == 'spdk-site-validation'
    && format('({0}/{1}){2}',
       github.event.client_payload.change.number,
       github.event.client_payload.patchSet.number,
       github.event.client_payload.change.subject)
    || github.event_name == 'workflow_dispatch' && inputs.client_payload != ''
    && format('Manual: ({0}/{1}){2}',
       fromJson(inputs.client_payload).change.number,
       fromJson(inputs.client_payload).patchSet.number,
       fromJson(inputs.client_payload).change.subject)
    || 'Validate SPDK Website'
  }}

"on":
  repository_dispatch:
    types:
      - spdk-site-validation
  pull_request:
    paths:
      - '.github/actions/checkout_gerrit/**'
      - '.github/scripts/parse_gerrit_webhook.sh'
      - '.github/workflows/spdk-site-build.yml'
  workflow_dispatch:
    inputs:
      client_payload:
        required: false
        type: string
        default: ''
      site_gerrit_ref:
        description: 'Gerrit refspec for spdk.github.io (e.g. refs/changes/XX/12345/5)'
        required: false
        type: string
        default: ''
      site_repo:
        description: 'GitHub owner/repo for spdk.github.io'
        required: false
        type: string
        default: ''

concurrency:
  group: >-
    site-validate-${{ github.event.client_payload.change.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  patch_set_status:
    name: Verify patch set state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.action == 'spdk-site-validation'
      || (github.event_name == 'workflow_dispatch' && inputs.client_payload != '')
    outputs:
      client_payload: ${{ steps.refs.outputs.client_payload }}
      site_gerrit_ref: ${{ steps.refs.outputs.site_gerrit_ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      client_payload: >-
        ${{ github.event.client_payload != ''
            && toJson(github.event.client_payload)
            || inputs.client_payload }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check patch set status
        env:
          CHANGE_NUM: ${{ fromJSON(env.client_payload).change.number }}
          PATCH_SET: ${{ fromJSON(env.client_payload).patchSet.number }}
          TITLE: ${{ fromJSON(env.client_payload).change.subject }}
          GERRIT_PROJECT: ${{ fromJSON(env.client_payload).change.project }}
          GERRIT_BOT_USER: ${{ secrets.GERRIT_BOT_USER }}
        run: .github/scripts/parse_gerrit_webhook.sh
      - name: Extract Gerrit ref
        id: refs
        run: |
          compact_payload=$(jq -c . <<< "$client_payload")
          site_gerrit_ref=$(jq -r '.patchSet.ref // empty' <<< "$client_payload")
          [[ "$site_gerrit_ref" =~ ^refs/changes/[0-9]{2}/[0-9]+/[0-9]+$ ]]
          echo "client_payload=$compact_payload" >> "$GITHUB_OUTPUT"
          echo "site_gerrit_ref=$site_gerrit_ref" >> "$GITHUB_OUTPUT"

  build:
    name: Build website
    needs: [patch_set_status]
    if: ${{ !cancelled() && needs.patch_set_status.result != 'failure' }}
    # NOTE: uses: must be a static string (GitHub limitation). For fork
    # testing, change 'spdk' below to your GitHub username. Patches that
    # modify build-site.yml itself are validated against the master version.
    uses: spdk/spdk.github.io/.github/workflows/build-site.yml@master
    with:
      site_gerrit_ref: >-
        ${{ needs.patch_set_status.outputs.site_gerrit_ref
            || inputs.site_gerrit_ref }}
      site_repo: >-
        ${{ inputs.site_repo
            || format('{0}/spdk.github.io', github.repository_owner) }}
      spdk_repo: ${{ format('{0}/spdk', github.repository_owner) }}
      baseurl: ${{ github.repository_owner != 'spdk' && '/spdk.github.io' || '' }}
      url: >-
        ${{ github.repository_owner == 'spdk'
            && 'https://www.spdk.io'
            || format('https://{0}.github.io', github.repository_owner) }}

  report:
    name: Report results to Gerrit
    needs: [patch_set_status, build]
    if: >-
      always()
      && needs.patch_set_status.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      CHANGE_NUM: ${{ fromJson(needs.patch_set_status.outputs.client_payload).change.number }}
      GERRIT_BOT_HTTP_PASSWD: ${{ secrets.GERRIT_BOT_HTTP_PASSWD }}
      GERRIT_BOT_USER: ${{ secrets.GERRIT_BOT_USER }}
      PATCH_SET: ${{ fromJson(needs.patch_set_status.outputs.client_payload).patchSet.number }}
      REPOSITORY: ${{ github.repository }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}
      SERVER_URL: ${{ github.server_url }}
    steps:
      - name: Post Gerrit review
        run: |
          set -euo pipefail
          [[ "$CHANGE_NUM" =~ ^[0-9]+$ ]]
          [[ "$PATCH_SET" =~ ^[0-9]+$ ]]

          vote="-1"; message="Build failed. "
          if [[ "$BUILD_RESULT" == "success" ]]; then
            vote="1"; message="Build successful. "
          fi
          message+="Results: [$RUN_ID/$RUN_ATTEMPT]"
          message+="($SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT)"
          jq -n \
            --arg message "$message" \
            --argjson vote "$vote" \
            '{message: $message, labels: {Verified: $vote}}' > review.json

          curl --fail-with-body --location \
            --connect-timeout 10 --max-time 30 --retry 2 \
            --request POST \
            "https://review.spdk.io/a/changes/$CHANGE_NUM/revisions/$PATCH_SET/review" \
            --user "$GERRIT_BOT_USER:$GERRIT_BOT_HTTP_PASSWD" \
            --header "Content-Type: application/json" \
            --data-binary @review.json
