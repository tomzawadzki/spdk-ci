---
name: 'Install CIJoe'
description: 'Install the CIJoe version that every spdk-ci job runs'

runs:
  using: 'composite'
  steps:
  - name: Install CIJoe
    shell: bash
    env:
      # The only place that sets the CIJoe version. cijoe-docker images come with
      # their own CIJoe, which is replaced here, so their tag only picks the toolchain.
      CIJOE_VERSION: '0.9.60'
    run: |
      if pipx runpip cijoe --version >/dev/null 2>&1; then
        pip=(pipx runpip cijoe)
      else
        pip=(pip)
      fi
      "${pip[@]}" install "cijoe==$CIJOE_VERSION"
      # Carry the upstream fix for slow, garbled command output until a release has
      # it. git apply fails on a CIJoe that changed the patched code, such as one that
      # already has the fix.
      site=$("${pip[@]}" show cijoe | sed -n 's/^Location: //p')
      git -C "$site" apply "$GITHUB_ACTION_PATH/cijoe-read-output-in-blocks.patch"
      cijoe --version
