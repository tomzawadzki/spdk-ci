---
name: 'Install CIJoe'
description: 'Install the CIJoe version that every spdk-ci job runs'

runs:
  using: 'composite'
  steps:
  - name: Install CIJoe
    shell: bash
    env:
      # The only place that sets the CIJoe version. cijoe-docker images come with
      # their own CIJoe, which is replaced here, so their tag only picks the toolchain.
      CIJOE_VERSION: '0.9.70'
    run: |
      if pipx runpip cijoe --version >/dev/null 2>&1; then
        pip=(pipx runpip cijoe)
      else
        pip=(pip)
      fi
      "${pip[@]}" install "cijoe==$CIJOE_VERSION"
      # CIJoe reads command output one byte at a time, which is too slow for the
      # tests' logs. Carry the fix until a release has it. git apply fails once
      # CIJoe changes the patched code, and the patches then have to be dropped.
      site=$("${pip[@]}" show cijoe | sed -n 's/^Location: //p')
      git -C "$site" apply -p2 --include='cijoe/*' "$GITHUB_ACTION_PATH"/patches/*.patch
      grep -q READ_SIZE "$site/cijoe/core/transport.py"
      cijoe --version
