SPDK_RUN_FUNCTIONAL_TEST=0
SPDK_TEST_NVMF=1
SPDK_TEST_NVMF_TRANSPORT=rdma
SPDK_TEST_NVMF_NICS=mlx5
NET_TYPE=phy
SPDK_RUN_UBSAN=1
AUTOTEST_COLORS_ENABLED=no
# run_rxe_tests.sh runs each script in RXE_TESTS, relative to the SPDK repo,
# with RXE_TEST_ARGS, RXE_TEST_REPEAT times, and fails a run that takes
# longer than RXE_TEST_TIMEOUT seconds.
RXE_TESTS="test/nvmf/target/ns_hotplug_stress.sh"
RXE_TEST_ARGS="--transport=rdma --interrupt-mode"
RXE_TEST_REPEAT=20
RXE_TEST_TIMEOUT=300
